name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
assignees:
  - Aether-254
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start server with AetherAC
        2. Join as player
        3. Do X
        4. See Y happen
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "It should do Z instead of Y"
    validations:
      required: true

  - type: dropdown
    id: server_platform
    attributes:
      label: Server Platform
      description: What server platform are you using?
      options:
        - Paper
        - Purpur
        - Spigot
        - Folia
        - Fabric
        - Forge
        - NeoForge
        - Velocity (Proxy)
        - BungeeCord (Proxy)
        - Other
    validations:
      required: true

  - type: input
    id: server_version
    attributes:
      label: Server Version
      description: What version of the server platform are you running?
      placeholder: "1.21.1"
    validations:
      required: true

  - type: input
    id: ac_version
    attributes:
      label: AetherAC Version
      description: What version of AetherAC are you using?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please copy and paste any relevant logs. (accept mclo.gs links)
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help us diagnose the issue.
      placeholder: "Screenshots, videos, mod list, etc."
